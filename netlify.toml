[build]
  publish = "public"

# Só o deploy de produção aplica as migrações no Supabase. Previews de branch
# e de pull request não mexem no banco.
[context.production]
  command = "npm run migrate"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
